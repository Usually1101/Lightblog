<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="siteTitle">Usually Blog</title>
    <link rel="icon" id="siteFavicon" href="picture/head.jpg">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" id="hljs-theme" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>
    <!-- 🆕 引入配置文件 -->
    <script src="config.js">
    </script>
    <style>
        /* ===== CSS 变量（主题切换） ===== */
        :root {
            --bg-image: url('picture/background1.jpg');
            --bg-color: transparent;
            --card-bg: rgba(255, 255, 255, 0.10);
            --card-bg-solid: rgba(255, 255, 255, 0.10);
            --text-color: #fff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.05);
            --tag-bg: rgba(255, 255, 255, 0.08);
            --scrollbar-track: rgba(255, 255, 255, 0.05);
            --scrollbar-thumb: rgba(255, 255, 255, 0.2);
            --hero-bg: rgba(255, 255, 255, 0.12);
            --home-right-bg: rgba(255, 255, 255, 0.06);
            --btn-bg: rgba(255, 255, 255, 0.08);
            --btn-hover: rgba(255, 255, 255, 0.22);
            --post-card-border: rgba(255, 255, 255, 0.12);
            --login-bg: rgba(255, 255, 255, 0.08);
            --zoom-bg: rgba(255, 255, 255, 0.10);
            --divider-color: rgba(255, 255, 255, 0.08);
            --file-item-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="dark"] {
            --bg-image: none;
            --bg-color: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-bg-solid: rgba(30, 30, 50, 0.85);
            --text-color: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --input-bg: rgba(255, 255, 255, 0.03);
            --tag-bg: rgba(255, 255, 255, 0.05);
            --scrollbar-track: rgba(255, 255, 255, 0.02);
            --scrollbar-thumb: rgba(255, 255, 255, 0.1);
            --hero-bg: rgba(255, 255, 255, 0.06);
            --home-right-bg: rgba(255, 255, 255, 0.04);
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-hover: rgba(255, 255, 255, 0.18);
            --post-card-border: rgba(255, 255, 255, 0.06);
            --login-bg: rgba(255, 255, 255, 0.05);
            --zoom-bg: rgba(30, 30, 50, 0.9);
            --divider-color: rgba(255, 255, 255, 0.06);
            --file-item-bg: rgba(255, 255, 255, 0.03);
        }

        /* ===== 重置 & 全局背景 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            color: var(--text-color);
            line-height: 1.7;
            min-height: 100vh;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: var(--bg-color);
            padding: 0;
            transition: background-color 0.4s, color 0.4s;
        }
        [data-theme="dark"] body {
            background-image: none;
            background-color: #1a1a2e;
        }

        .hidden {
            display: none !important;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 8px;
        }

        /* ===== 毛玻璃通用 ===== */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px var(--shadow-color);
            border-radius: 16px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s;
        }
        .glass:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 40px var(--shadow-color);
        }

        /* ===== 导航栏（固定顶部） ===== */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1100px;
            z-index: 100;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 60px;
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: transform 0.2s, background 0.3s;
        }
        .navbar:hover {
            transform: translateX(-50%) scale(1.01);
        }
        .navbar .brand {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .navbar .brand span {
            color: var(--text-secondary);
        }
        .navbar .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .navbar .nav-links a {
            font-size: 15px;
            color: var(--text-secondary);
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .navbar .nav-links a:hover {
            color: var(--text-color);
            border-bottom-color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
        }
        .navbar .nav-links a.active {
            color: var(--text-color);
            border-bottom-color: #fff;
            font-weight: 500;
        }
        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: transform 0.2s;
            opacity: 0.8;
        }
        .theme-toggle:hover {
            transform: scale(1.15);
            opacity: 1;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        /* ===== 页面顶部内边距 ===== */
        #page-about,
        #page-admin,
        #page-post,
        #page-files {
            padding-top: 90px;
        }
        #page-posts {
            padding-top: 140px;
        }

        /* ===== 首页 ===== */
        #page-home {
            min-height: calc(100vh - 130px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 90px 0 40px;
        }
        .home-grid {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: minmax(280px, 1.1fr) minmax(320px, 1fr);
            gap: 28px;
            align-items: start;
            margin: 0 auto;
        }

        .hero {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-align: left;
            color: var(--text-color);
            padding: 28px 26px;
            background: var(--hero-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 24px 60px var(--shadow-color);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-sizing: border-box;
            transition: background 0.3s, border-color 0.3s;
        }
        .hero .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            align-self: flex-start;
            margin-bottom: 16px;
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .hero .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .hero .avatar:hover {
            transform: scale(1.05);
        }
        .hero h1 {
            font-size: 44px;
            font-weight: 700;
            margin-bottom: 4px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: left;
            width: 100%;
        }
        .hero .subtitle {
            font-size: 17px;
            opacity: 0.9;
            max-width: 100%;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            text-align: left;
            width: 100%;
            min-height: 2em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .hero .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--text-color);
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        .hero .bio-text {
            font-size: 16px;
            max-width: 640px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            width: 100%;
        }
        .hero .scroll-hint {
            margin-top: 14px;
            font-size: 13px;
            opacity: 0.6;
            color: var(--text-secondary);
            width: 100%;
            text-align: left;
        }

        .home-right {
            width: 100%;
            height: 100%;
            background: var(--home-right-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px 22px 16px 22px;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }

        .home-right .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .home-right .section-title .badge {
            font-size: 13px;
            font-weight: 1000;
            color: var(--text-secondary);
            background: var(--tag-bg);
            padding: 0 12px;
            border-radius: 20px;
        }
        .home-right .section-divider {
            border: none;
            border-top: 1px solid var(--divider-color);
            margin: 16px 0;
        }

        /* ===== 文章卡片 ===== */
        .post-card {
            background: transparent;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--post-card-border);
            border-radius: 14px;
            padding: 16px 22px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 4px 20px var(--shadow-color);
        }
        .post-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.03);
        }
        .post-card .post-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
        }
        .post-card .post-meta {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .post-card .tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--text-secondary);
            font-size: 11px;
            padding: 1px 10px;
            border-radius: 20px;
        }
        .post-card .post-summary {
            margin-top: 6px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== 底部模块 ===== */
        .home-footer {
            width: 100%;
            max-width: 960px;
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .home-footer .footer-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 22px 26px;
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: transform 0.25s, box-shadow 0.25s, background 0.3s;
        }
        .home-footer .footer-card:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 40px var(--shadow-color);
        }
        .home-footer .footer-card .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
        }
        .home-footer .footer-card .card-title .emoji {
            margin-right: 8px;
        }

        .footer-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .footer-tags .tag-btn {
            background: var(--tag-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 2px 14px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .footer-tags .tag-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
        }

        .footer-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 28px;
        }
        .footer-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .footer-stats .stat-item .num {
            font-weight: 600;
            color: var(--text-color);
            font-size: 18px;
        }

        /* ===== 🆕 优化后的友链样式（毛玻璃卡片按钮） ===== */
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .footer-links .link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 18px;
            border: 1px solid var(--border-color);
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--btn-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            min-height: 34px;
        }
        .footer-links .link-btn:hover {
            transform: scale(1.06);
            background: var(--btn-hover);
            color: var(--text-color);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
            text-decoration: none;
        }
        .footer-links .link-btn:active {
            transform: scale(0.96);
        }
        .footer-links .link-btn .emoji {
            font-size: 14px;
        }

        /* ===== 社交链接（约等） ===== */
        .about-links {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }
        .about-link-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 18px;
            min-height: 34px;
            border: 1px solid var(--border-color);
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--btn-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
            cursor: pointer;
            flex: 0 1 auto;
            min-width: 60px;
        }
        .about-link-card:hover {
            transform: scale(1.06);
            background: var(--btn-hover);
            color: var(--text-color);
        }
        .about-link-card:active {
            transform: scale(0.96);
        }
        .about-link-github {
            background: rgba(40, 40, 50, 0.35);
        }
        .about-link-github:hover {
            background: rgba(40, 40, 50, 0.60);
        }
        .about-link-twitter {
            background: rgba(29, 161, 242, 0.25);
        }
        .about-link-twitter:hover {
            background: rgba(29, 161, 242, 0.50);
        }
        .about-link-bilibili {
            background: rgba(234, 123, 188, 0.25);
        }
        .about-link-bilibili:hover {
            background: rgba(234, 123, 188, 0.50);
        }

        /* ===== 卡片（其他页面） ===== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 28px 32px;
            margin-bottom: 28px;
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: transform 0.25s, box-shadow 0.25s, background 0.3s;
            color: var(--text-color);
        }
        .card:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 40px var(--shadow-color);
        }
        .card .page-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .card .text-muted {
            color: var(--text-secondary);
        }
        .card .tag {
            background: var(--tag-bg);
            color: var(--text-secondary);
        }

        /* ===== 统一按钮 ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 22px;
            border: 1px solid var(--border-color);
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
            background: var(--btn-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            user-select: none;
            white-space: nowrap;
            min-height: 38px;
        }
        .btn:hover {
            transform: scale(1.06);
            background: var(--btn-hover);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-sm {
            padding: 4px 16px;
            font-size: 13px;
            min-height: 30px;
            border-radius: 30px;
        }
        .btn-primary {
            background: rgba(122, 155, 170, 0.30);
            border-color: rgba(122, 155, 170, 0.25);
        }
        .btn-primary:hover {
            background: rgba(122, 155, 170, 0.55);
        }
        .btn-danger {
            background: rgba(217, 122, 122, 0.30);
            border-color: rgba(217, 122, 122, 0.25);
        }
        .btn-danger:hover {
            background: rgba(217, 122, 122, 0.55);
        }
        .btn-success {
            background: rgba(122, 170, 138, 0.30);
            border-color: rgba(122, 170, 138, 0.25);
        }
        .btn-success:hover {
            background: rgba(122, 170, 138, 0.55);
        }
        .btn-warning {
            background: rgba(200, 180, 80, 0.30);
            border-color: rgba(200, 180, 80, 0.25);
        }
        .btn-warning:hover {
            background: rgba(200, 180, 80, 0.55);
        }

        .login-container .btn {
            width: 100%;
            justify-content: center;
            padding: 12px;
        }

        /* ===== 关于页 ===== */
        .about-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 16px;
        }

        /* ===== 文章详情 ===== */
        .post-actions {
            margin-top: 34px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .zoom-close {
            position: sticky;
            top: 0;
            float: right;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--btn-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-color);
            font-size: 24px;
            line-height: 44px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            margin-top: -8px;
            margin-right: -12px;
            z-index: 10;
            flex-shrink: 0;
        }
        .zoom-close:hover {
            transform: scale(1.12);
            background: var(--btn-hover);
        }
        .zoom-close:active {
            transform: scale(0.92);
        }
        .post-detail {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 30px;
        }
        .post-detail .post-title {
            color: var(--text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            font-size: 42px;
            line-height: 1.1;
            margin-bottom: 18px;
        }
        .post-detail .post-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 26px;
        }
        .post-detail .post-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--tag-bg);
            border-radius: 999px;
        }
        .post-detail .post-content {
            color: var(--text-color);
            line-height: 1.95;
            font-size: 17px;
        }
        .post-detail .post-content p {
            margin: 20px 0;
        }
        .post-detail .post-content img {
            max-width: 100%;
            border-radius: 14px;
            margin: 24px 0;
            display: block;
        }
        .post-detail .post-content pre {
            background: rgba(0, 0, 0, 0.25);
            padding: 18px;
            border-radius: 16px;
            overflow-x: auto;
        }
        .post-detail .post-content code {
            background: var(--tag-bg);
            color: #f8d7da;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .post-detail .post-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: 0.9em;
        }
        .post-detail .post-content blockquote {
            border-left-color: rgba(255, 255, 255, 0.3);
            background: var(--tag-bg);
            color: var(--text-secondary);
            padding: 18px 20px;
            margin: 24px 0;
            border-radius: 14px;
        }
        .post-detail .post-content h1,
        .post-detail .post-content h2,
        .post-detail .post-content h3 {
            color: var(--text-color);
        }

        /* ===== 管理后台 ===== */
        .admin-list .post-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: transparent;
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 1px solid transparent;
            transition: transform 0.2s;
        }
        .admin-list .post-item:hover {
            transform: scale(1.01);
            background: var(--tag-bg);
        }
        .admin-list .post-item .post-info {
            flex: 1;
            min-width: 160px;
        }
        .admin-list .post-item .post-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-form input,
        .admin-form textarea {
            background: var(--input-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 15px;
            width: 100%;
            transition: 0.2s;
        }
        .admin-form input:focus,
        .admin-form textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }
        .admin-form input::placeholder,
        .admin-form textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        .admin-form label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ===== 登录界面 ===== */
        .login-container {
            max-width: 400px;
            margin: 20px auto;
            padding: 30px;
            background: var(--login-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
        }
        .login-container input {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
        }
        .login-container input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .login-error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
        }
        .login-success {
            color: #69db7c;
            font-size: 14px;
            margin-top: 10px;
        }
        .admin-content {
            display: none;
        }
        .admin-content.active {
            display: block;
        }

        /* ===== 文章页：搜索 / 标签云 / 归档 ===== */
        .posts-toolbar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        .posts-toolbar .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .posts-toolbar .search-box input {
            flex: 1;
            min-width: 180px;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s;
        }
        .posts-toolbar .search-box input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .posts-toolbar .search-box input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 0;
        }
        .tag-cloud .tag-btn {
            background: var(--tag-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .tag-cloud .tag-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
        }
        .tag-cloud .tag-btn.active {
            background: rgba(122, 155, 170, 0.35);
            color: var(--text-color);
            border-color: rgba(122, 155, 170, 0.4);
        }

        .archive-year {
            margin-bottom: 24px;
        }
        .archive-year .year-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s;
        }
        .archive-year .year-title:hover {
            opacity: 0.7;
        }
        .archive-month {
            margin-left: 20px;
            margin-bottom: 12px;
        }
        .archive-month .month-title {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s;
        }
        .archive-month .month-title:hover {
            opacity: 0.7;
        }
        .archive-month .month-posts {
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .archive-month .month-posts .archive-post {
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .archive-month .month-posts .archive-post:hover {
            transform: translateX(4px);
        }
        .archive-month .month-posts .archive-post .post-title {
            color: var(--text-color);
        }
        .archive-month .month-posts .archive-post .post-date {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ===== 🆕 文件云盘样式 ===== */
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            background: var(--input-bg);
            margin-bottom: 20px;
        }
        .file-upload-area:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: var(--tag-bg);
        }
        .file-upload-area.dragover {
            border-color: rgba(122, 155, 170, 0.7);
            background: rgba(122, 155, 170, 0.10);
        }
        .file-upload-area .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .file-upload-area p {
            color: var(--text-secondary);
            font-size: 15px;
        }
        .file-upload-area .hint {
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-top: 4px;
        }
        .file-upload-area input[type="file"] {
            display: none;
        }

        .file-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-list-header .file-count {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: var(--file-item-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            transition: transform 0.2s, background 0.2s;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-item:hover {
            transform: scale(1.01);
            background: var(--tag-bg);
        }
        .file-item .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 150px;
        }
        .file-item .file-info .file-icon {
            font-size: 28px;
            line-height: 1;
            flex-shrink: 0;
        }
        .file-item .file-info .file-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-color);
            word-break: break-all;
        }
        .file-item .file-info .file-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .file-item .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .file-item .file-actions .btn {
            padding: 4px 14px;
            font-size: 13px;
            min-height: 30px;
        }
        .file-item .file-actions .btn-download {
            background: rgba(122, 155, 170, 0.20);
            border-color: rgba(122, 155, 170, 0.20);
        }
        .file-item .file-actions .btn-download:hover {
            background: rgba(122, 155, 170, 0.45);
        }
        .file-item .file-actions .btn-delete {
            background: rgba(217, 122, 122, 0.20);
            border-color: rgba(217, 122, 122, 0.20);
        }
        .file-item .file-actions .btn-delete:hover {
            background: rgba(217, 122, 122, 0.45);
        }

        .upload-progress {
            margin: 12px 0;
            padding: 10px 16px;
            background: var(--tag-bg);
            border-radius: 10px;
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .upload-progress .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            min-width: 100px;
        }
        .upload-progress .progress-bar .fill {
            height: 100%;
            background: #7aaa8a;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
        }
        .upload-progress .progress-text {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* ===== 加载 & 空状态 ===== */
        .loading {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
        }
        .loading::after {
            content: "…";
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0% {
                content: "";
            }
            25% {
                content: ".";
            }
            50% {
                content: "..";
            }
            75% {
                content: "...";
            }
            100% {
                content: "";
            }
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* ===== 放大阅读模态框 ===== */
        .zoom-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .zoom-overlay.active {
            display: flex;
            opacity: 1;
        }
        .zoom-content {
            background: var(--zoom-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 820px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px 50px;
            box-shadow: 0 20px 60px var(--shadow-color);
            position: relative;
            transform: scale(0.95);
            transition: transform 0.25s ease;
            color: var(--text-color);
        }
        .zoom-overlay.active .zoom-content {
            transform: scale(1);
        }
        .zoom-content .zoom-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .zoom-content .zoom-meta {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .zoom-content .zoom-body {
            font-size: 18px;
            line-height: 2;
            color: var(--text-color);
        }
        .zoom-content .zoom-body h1,
        .zoom-content .zoom-body h2,
        .zoom-content .zoom-body h3 {
            color: var(--text-color);
        }
        .zoom-content .zoom-body code {
            background: var(--tag-bg);
            color: #f8d7da;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .zoom-content .zoom-body pre code {
            background: transparent;
        }
        .zoom-content .zoom-body blockquote {
            border-left-color: rgba(255, 255, 255, 0.3);
            background: var(--tag-bg);
            color: var(--text-secondary);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .home-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .hero h1 {
                font-size: 38px;
            }
            .hero .avatar {
                width: 90px;
                height: 90px;
            }
            .home-footer {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .file-item {
                flex-direction: column;
                align-items: stretch;
            }
            .file-item .file-actions {
                justify-content: flex-end;
            }
        }

        @media (max-width: 640px) {
            .navbar {
                top: 12px;
                padding: 12px 20px;
                border-radius: 40px;
                width: calc(100% - 24px);
            }
            .navbar .brand {
                font-size: 18px;
            }
            .navbar .nav-links {
                gap: 14px;
            }
            .hero h1 {
                font-size: 32px;
            }
            .hero .subtitle {
                font-size: 15px;
            }
            .card {
                padding: 20px 18px;
            }
            .post-card {
                padding: 14px 16px;
            }
            .zoom-content {
                padding: 24px 20px;
            }
            .zoom-content .zoom-title {
                font-size: 26px;
            }
            .zoom-content .zoom-body {
                font-size: 16px;
            }
            #page-about,
            #page-admin,
            #page-post,
            #page-files {
                padding-top: 100px;
            }
            #page-posts {
                padding-top: 100px;
            }
            .login-container {
                margin: 20px 10px;
            }
            .btn {
                padding: 6px 16px;
                font-size: 13px;
                min-height: 34px;
            }
            .btn-sm {
                padding: 3px 12px;
                font-size: 12px;
                min-height: 28px;
            }
            .about-link-card {
                padding: 6px 16px;
                font-size: 13px;
                min-height: 34px;
            }
            .post-actions {
                gap: 8px;
            }
            .post-actions .btn {
                padding: 6px 14px;
                font-size: 13px;
            }
            .admin-list .post-item .post-actions {
                gap: 6px;
            }
            .admin-list .post-item .post-actions .btn {
                padding: 4px 12px;
                font-size: 12px;
                min-height: 28px;
            }
            .posts-toolbar .search-box input {
                font-size: 14px;
                padding: 8px 14px;
            }
            .archive-month .month-posts .archive-post {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .home-right .section-title {
                font-size: 17px;
            }
            .home-footer .footer-card {
                padding: 16px 18px;
            }
            .footer-stats {
                gap: 10px 16px;
            }
            .footer-stats .stat-item {
                font-size: 13px;
            }
            .footer-stats .stat-item .num {
                font-size: 16px;
            }
            .file-upload-area {
                padding: 24px 16px;
            }
            .file-upload-area .icon {
                font-size: 36px;
            }
            .file-item .file-info .file-icon {
                font-size: 22px;
            }
            .file-item .file-info .file-name {
                font-size: 14px;
            }
            .file-item .file-actions .btn {
                font-size: 12px;
                padding: 3px 12px;
                min-height: 26px;
            }
        }

        @media (max-width: 480px) {
            .btn {
                padding: 5px 12px;
                font-size: 12px;
                min-height: 30px;
                border-radius: 30px;
            }
            .btn-sm {
                padding: 2px 10px;
                font-size: 11px;
                min-height: 24px;
            }
            .about-link-card {
                padding: 5px 12px;
                font-size: 12px;
                min-height: 30px;
            }
            .zoom-close {
                width: 36px;
                height: 36px;
                font-size: 18px;
                line-height: 36px;
            }
            .hero .avatar {
                width: 72px;
                height: 72px;
            }
            .hero h1 {
                font-size: 28px;
            }
            .hero .subtitle {
                font-size: 14px;
                min-height: 1.6em;
            }
            .post-card .post-title {
                font-size: 16px;
            }
            .navbar .nav-links {
                gap: 10px;
            }
            .navbar .nav-links a {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand"><span id="brandName">Usually的博客</span></div>
        <div class="nav-links" id="navLinks">
            <!-- 由 JavaScript 动态生成 -->
        </div>
    </nav>

    <div class="container" id="main-container">

        <!-- ========== 首页 ========== -->
        <div id="page-home">
            <div class="home-grid">
                <section class="hero home-left">
                    <div class="avatar">
                        <img id="avatarImg" src="picture/head.jpg" alt="头像" />
                    </div>
                    <h1 id="authorName">Usually</h1>
                    <div class="bio-text" id="authorBio">计算机小白;喜欢跑步;MTF;喜欢听歌;地区Online等级13</div>
                    <div class="subtitle" id="typewriter"></div>
                    <div class="about-links" id="socialLinks">
                        <!-- 由 JavaScript 动态生成 -->
                    </div>
                </section>

                <div class="home-right">
                    <div class="post-section">
                        <div class="section-title">
                            最近文章:
                            <span class="badge" id="recentBadge">加载中</span>
                        </div>
                        <div id="post-list">
                            <div class="loading">加载文章列表</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部模块 -->
            <div class="home-footer" id="homeFooter">
                <div class="footer-card">
                    <div class="card-title"><span class="emoji">📊</span>站点统计</div>
                    <div class="footer-stats" id="footerStats">
                        <div class="stat-item" id="statPostsLabel">📝文章 <span class="num" id="statPosts">0</span></div>
                        <div class="stat-item" id="statTagsLabel">🏷️标签 <span class="num" id="statTags">0</span></div>
                        <div class="stat-item" id="statViewsLabel">👁️浏览量 <span class="num" id="statViews">0</span></div>
                    </div>
                </div>

                <div class="footer-card">
                    <div class="card-title"><span class="emoji">🏷️标签集</span></div>
                    <div class="footer-tags" id="footerTags">
                        <span style="color:var(--text-secondary);font-size:14px;">加载中...</span>
                    </div>
                </div>

                <div class="footer-card">
                    <div class="card-title"><span class="emoji">🔗</span>其它链接:</div>
                    <div class="footer-links" id="footerLinks">
                        <!-- 由 JavaScript 动态生成 -->
                    </div>
                </div>

                <div class="footer-card">
                    <div class="card-title"><span class="emoji">ℹ️</span>关于本站</div>
                    <p id="footerCopyright" style="color:var(--text-secondary);font-size:14px;line-height:1.8;"></p>
                </div>
            </div>
        </div>

        <!-- ========== 关于 ========== -->
        <div id="page-about" class="page-container hidden">
            <div class="card">
                <h2 class="page-title" id="aboutTitle">关于我</h2>
                <div id="aboutContent" style="color:var(--text-secondary);margin-bottom:16px;font-size:15px;"></div>
                <div class="about-links" id="aboutSocialLinks">
                    <!-- 由 JavaScript 动态生成 -->
                </div>
            </div>
        </div>

        <!-- ========== 文章 ========== -->
        <div id="page-posts" class="page-container hidden">
            <div class="card">
                <h2 class="page-title" id="postsTitle">📚 文章归档</h2>
                <div class="posts-toolbar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="🔍 搜索文章..." />
                        <button class="btn btn-sm" id="clearSearchBtn">清除</button>
                    </div>
                    <div id="tagCloud" class="tag-cloud"></div>
                </div>
                <div id="archiveContainer"></div>
                <div id="filteredPosts" style="display:none;"></div>
            </div>
        </div>

        <!-- ========== 文件云盘 ========== -->
        <div id="page-files" class="page-container hidden">
            <div class="card">
                <h2 class="page-title" id="filesTitle">📁 文件云盘</h2>
                <p id="filesDesc" style="color:var(--text-secondary);margin-bottom:16px;font-size:15px;"></p>

                <div class="file-upload-area" id="uploadArea">
                    <span class="icon">📤</span>

                                <input type="file" id="imageInput" accept="image/*" multiple style="background:var(--input-bg); border:1px solid var(--border-color); border-radius:8px; padding:6px 10px; color:var(--text-color); width:auto;" />

                                <span id="uploadStatus" style="color:var(--text-secondary); font-size:14px;"></span>

                    <h2 id="allPostsTitle" style="font-size:18px; font-weight:500; color:var(--text-color); margin-bottom:16px;">所有文章:</h2>

    <!-- ===== 放大阅读模态框 ===== -->
