        <div class="zoom-content">
            <button class="zoom-close" id="zoomCloseBtn">✕</button>
            <div id="zoomTitle" class="zoom-title"></div>
            <div id="zoomMeta" class="zoom-meta"></div>
            <div id="zoomBody" class="zoom-body"></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  🆕 从配置加载数据
        // ============================================================
        const C = window.BLOG_CONFIG || {};

        // ----- 网站基本信息 -----
        if (C.site) {
            document.title = C.site.title || 'Usually Blog';
            document.getElementById('siteTitle').textContent = C.site.title || 'Usually Blog';
            if (C.site.favicon) {
                document.getElementById('siteFavicon').href = C.site.favicon;
            }
            if (C.site.brand) {
                document.getElementById('brandName').textContent = C.site.brand;
            }
        }

        // ----- 导航菜单 -----
        if (C.nav && Array.isArray(C.nav)) {
            const navContainer = document.getElementById('navLinks');
            navContainer.innerHTML = C.nav.map(item =>
                `<a data-page="${item.id}" class="${item.id === 'home' ? 'active' : ''}">${item.label}</a>`
            ).join('');
            navContainer.innerHTML += `<button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>`;
        }

        // ----- 个人信息 -----
        if (C.author) {
            document.getElementById('authorName').textContent = C.author.name || 'Usually';
            document.getElementById('authorBio').textContent = C.author.bio || '';
            if (C.author.avatar) {
                document.getElementById('avatarImg').src = C.author.avatar;
            }
            // 座右铭
            if (C.author.mottoes) {
                window.MOTTOES = C.author.mottoes;
            }
            // 社交链接（首页）
            if (C.author.social && Array.isArray(C.author.social)) {
                const socialContainer = document.getElementById('socialLinks');
                socialContainer.innerHTML = C.author.social.map(s =>
                    `<a class="about-link-card about-link-${s.name.toLowerCase()}" href="${s.url}" target="_blank" rel="noopener noreferrer" aria-label="${s.name}">${s.icon || s.name}</a>`
                ).join('');
            }
            // 底部签名
            if (C.author.scrollHint) {
                const hintEl = document.querySelector('.hero .scroll-hint');
                if (hintEl) hintEl.textContent = C.author.scrollHint;
            }
        }

        // ----- 底部友链 -----
        if (C.footer && C.footer.links) {
            const linksContainer = document.getElementById('footerLinks');
            linksContainer.innerHTML = C.footer.links.map(link =>
                `<a class="link-btn" href="${link.url}" target="_blank">${link.name}</a>`
            ).join('');
        }
        if (C.footer && C.footer.copyright) {
            document.getElementById('footerCopyright').textContent = C.footer.copyright;
        }
        if (C.footer && C.footer.stats) {
            const stats = C.footer.stats;
            document.getElementById('statPostsLabel').innerHTML = `${stats.posts} <span class="num" id="statPosts">0</span>`;
            document.getElementById('statTagsLabel').innerHTML = `${stats.tags} <span class="num" id="statTags">0</span>`;
            document.getElementById('statViewsLabel').innerHTML = `${stats.views} <span class="num" id="statViews">0</span>`;
        }

        // ----- 关于页面 -----
        if (C.about) {
            document.getElementById('aboutTitle').textContent = C.about.title || '关于我';
            if (C.about.content && Array.isArray(C.about.content)) {
                document.getElementById('aboutContent').innerHTML = C.about.content.join('<br>');
            }
            if (C.about.social) {
                const container = document.getElementById('aboutSocialLinks');
                container.innerHTML = C.about.social.map(s =>
                    `<a class="about-link-card about-link-${s.name.toLowerCase()}" href="${s.url}" target="_blank" rel="noopener noreferrer" aria-label="${s.name}">${s.icon || s.name}</a>`
                ).join('');
            }
        }

        // ----- 文章页面 -----
        if (C.postsPage) {
            document.getElementById('postsTitle').textContent = C.postsPage.title || '📚 文章归档';
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.placeholder = C.postsPage.searchPlaceholder || '🔍 搜索文章...';
            const clearBtn = document.getElementById('clearSearchBtn');
            if (clearBtn) clearBtn.textContent = C.postsPage.clearBtn || '清除';
        }

        // ----- 文件云盘 -----
        if (C.fileCloud) {
            document.getElementById('filesTitle').textContent = C.fileCloud.title || '📁 文件云盘';
            document.getElementById('filesDesc').textContent = C.fileCloud.description || '';
            document.getElementById('uploadHint').textContent = C.fileCloud.uploadHint || '支持多文件上传，单个文件最大 100MB';
        }

        // ----- 管理后台 -----
        if (C.admin) {
            const a = C.admin;
            document.getElementById('loginTitle').textContent = a.loginTitle || '🔐 管理后台登录';
            document.getElementById('loginPassword').placeholder = a.loginPlaceholder || '请输入密码';
            document.getElementById('loginBtn').textContent = a.loginBtn || '登录';
            document.getElementById('logoutBtn').textContent = a.logoutBtn || '登出';
            document.getElementById('form-title').textContent = a.newPostTitle || '造篇新的';
            document.getElementById('submit-btn').textContent = a.submitBtn || 'OK🆗';
            document.getElementById('cancel-btn').textContent = a.cancelBtn || '取消编辑';
            document.getElementById('allPostsTitle').textContent = a.allPostsTitle || '所有文章:';
            document.getElementById('labelTitle').textContent = a.postTitle || '标题 *';
            document.getElementById('post-title').placeholder = a.postTitlePlaceholder || '输入文章标题';
            document.getElementById('labelSummary').textContent = a.summary || '摘要 (可选)';
            document.getElementById('post-summary').placeholder = a.summaryPlaceholder || '简短摘要';
            document.getElementById('labelTags').textContent = a.tags || '标签 (空格分隔)';
            document.getElementById('post-tags').placeholder = a.tagsPlaceholder || '例如： 技术 生活 随笔';
            document.getElementById('labelContent').textContent = a.content || '内容 (Markdown) *';
            document.getElementById('post-content').placeholder = a.contentPlaceholder || '使用 Markdown 书写…';
            document.getElementById('labelImageUpload').textContent = a.imageUpload || '插入图片（可多选）';
            document.getElementById('uploadBtn').textContent = a.uploadBtn || '上传并插入';
        }

        // ============================================================
        //  以下为原有功能代码（保持不变，仅数据从配置读取）
        // ============================================================

        const API_BASE = '/api';
        let authToken = localStorage.getItem('adminToken') || null;

        // ----- 工具函数 -----
        function formatDate(iso) {
            if (!iso) return '未知时间';
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        function formatDateShort(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function renderMarkdown(text) {
            if (!text) return '';
            try { return marked.parse(text); } catch (_) { return text; }
        }

        // ----- API -----
        async function apiFetch(path, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers,
            };
            if (authToken) {
                headers['Authorization'] = 'Bearer ' + authToken;
            }
            const res = await fetch(API_BASE + path, {
                ...options,
                headers: headers,
                body: options.body ? JSON.stringify(options.body) : undefined,
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                if (res.status === 401) {
                    localStorage.removeItem('adminToken');
                    authToken = null;
                    if (!document.getElementById('page-admin').classList.contains('hidden')) {
                        checkAdminAuth();
                    }
                }
                throw new Error(err.message || `请求失败 (${res.status})`);
            }
            return res.json();
        }

        // ----- 登录/登出 -----
        async function login(password) {
            const result = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password }),
            });
            const data = await result.json();
            if (!result.ok) throw new Error(data.message || '登录失败');
            authToken = data.token;
            localStorage.setItem('adminToken', authToken);
            return true;
        }

        function logout() {
            localStorage.removeItem('adminToken');
            authToken = null;
            fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + (authToken || '') } }).catch(
            () => {});
            checkAdminAuth();
        }

        function checkAdminAuth() {
            const loginArea = document.getElementById('loginArea');
            const adminContent = document.getElementById('adminContent');
            const loginMessage = document.getElementById('loginMessage');
            if (authToken) {
                loginArea.style.display = 'none';
                adminContent.classList.add('active');
                loadAdminList();
                resetForm();
            } else {
                loginArea.style.display = 'block';
                adminContent.classList.remove('active');
                loginMessage.textContent = '';
                document.getElementById('admin-list').innerHTML = '';
            }
        }

        // ----- 页面切换 -----
        const pages = {
            home: document.getElementById('page-home'),
            about: document.getElementById('page-about'),
            posts: document.getElementById('page-posts'),
            files: document.getElementById('page-files'),
            admin: document.getElementById('page-admin'),
            post: document.getElementById('page-post'),
        };
        const navLinks = document.querySelectorAll('.nav-links a[data-page]');

        function showPage(pageName) {
            Object.values(pages).forEach(el => el.classList.add('hidden'));
            if (pages[pageName]) pages[pageName].classList.remove('hidden');
            navLinks.forEach(link => {
                link.classList.toggle('active', link.dataset.page === pageName);
            });
            if (pageName === 'home') loadHome();
            if (pageName === 'posts') loadAllPosts();
            if (pageName === 'files') loadFiles();
            if (pageName === 'admin') {
                checkAdminAuth();
                if (authToken) { loadAdminList();
                    resetForm(); }
            }
            if (pageName === 'home') pages.post.classList.add('hidden');
        }

        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.dataset.page;
                showPage(page);
                if (page === 'admin') checkAdminAuth();
                if (page === 'home') pages.post.classList.add('hidden');
            });
        });

        // ----- 主题切换 -----
        const themeToggle = document.getElementById('themeToggle');
        let currentTheme = localStorage.getItem('theme') || 'light';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', theme);
            const hljsTheme = document.getElementById('hljs-theme');
            if (hljsTheme) {
                hljsTheme.href = theme === 'dark' ?
                    'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css' :
                    'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
            }
        }
        themeToggle.addEventListener('click', function() {
            const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
            currentTheme = nextTheme;
            applyTheme(currentTheme);
        });
        applyTheme(currentTheme);

        // ----- 登录事件 -----
        document.getElementById('loginBtn').addEventListener('click', async function() {
            const password = document.getElementById('loginPassword').value;
            const msgEl = document.getElementById('loginMessage');
            if (!password) { msgEl.textContent = '请输入密码'; return; }
            try {
                await login(password);
                msgEl.textContent = '';
                document.getElementById('loginPassword').value = '';
                checkAdminAuth();
                loadAdminList();
                resetForm();
            } catch (error) {
                msgEl.textContent = error.message;
            }
        });
        document.getElementById('loginPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // ============================================================
        //  打字机效果（从配置读取座右铭）
        // ============================================================
        const mottoes = window.MOTTOES || [
            '代码改变世界，文字温暖人心。',
            'Stay hungry, stay foolish.',
            '写博客是为了更好地思考。',
            '在技术的海洋里，做个快乐的拾贝人。',
        ];
        let mottoIndex = 0,
            charIndex = 0,
            isDeleting = false;
        const typewriterEl = document.getElementById('typewriter');

        function typeEffect() {
            const current = mottoes[mottoIndex];
            if (!isDeleting) {
                typewriterEl.innerHTML = current.substring(0, charIndex + 1) +
                '<span class="typewriter-cursor"></span>';
                charIndex++;
                if (charIndex === current.length) {
                    isDeleting = true;
                    setTimeout(typeEffect, 3000);
                    return;
                }
                setTimeout(typeEffect, 80 + Math.random() * 40);
            } else {
                typewriterEl.innerHTML = current.substring(0, charIndex) + '<span class="typewriter-cursor"></span>';
                charIndex--;
                if (charIndex < 0) {
                    isDeleting = false;
                    charIndex = 0;
                    mottoIndex = (mottoIndex + 1) % mottoes.length;
                    setTimeout(typeEffect, 500);
                    return;
                }
                setTimeout(typeEffect, 40 + Math.random() * 30);
            }
        }
        setTimeout(typeEffect, 500);

        // ============================================================
        //  首页加载
        // ============================================================
        async function loadHome() {
            const listEl = document.getElementById('post-list');
            const recentBadge = document.getElementById('recentBadge');
            const statPosts = document.getElementById('statPosts');
            const statTags = document.getElementById('statTags');
            const statViews = document.getElementById('statViews');
            const footerTags = document.getElementById('footerTags');

            listEl.innerHTML = `<div class="loading">加载文章列表</div>`;
            footerTags.innerHTML = '<span style="color:var(--text-secondary);font-size:14px;">加载中...</span>';

            try {
                const posts = await apiFetch('/posts');
                if (!posts || posts.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>还没有文章，去 <a href="#" onclick="showPage('admin'); return false;" style="color:var(--text-secondary);text-decoration:underline;">管理后台</a> 写一篇吧！</p>
                        </div>
                    `;
                    recentBadge.textContent = '0 篇';
                    statPosts.textContent = '0';
                    statTags.textContent = '0';
                    statViews.textContent = '0';
                    footerTags.innerHTML = '<span style="color:var(--text-secondary);font-size:14px;">暂无标签</span>';
                    return;
                }

                const sorted = [...posts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                const totalPosts = sorted.length;
                const allTags = new Set();
                let totalViews = 0;
                sorted.forEach(p => {
                    (p.tags || []).forEach(t => allTags.add(t));
                    totalViews += (p.views || 0);
                });
                const totalTags = allTags.size;

                statPosts.textContent = totalPosts;
                statTags.textContent = totalTags;
                statViews.textContent = totalViews;

                const recentCount = Math.min(5, totalPosts);
                const recentPosts = sorted.slice(0, recentCount);
                recentBadge.textContent = `${recentCount} 篇`;

                let recentHtml = '';
                recentPosts.forEach(p => {
                    const tags = (p.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
                    recentHtml += `
                        <div class="post-card" onclick="showPost('${p.id}')">
                            <div class="post-title">${p.title || '无标题'}</div>
                            <div class="post-meta">
                                <span>📅 ${formatDate(p.createdAt)}</span>
                                ${tags ? `<span>🏷️ ${tags}</span>` : ''}
                            </div>
                            ${p.summary ? `<div class="post-summary">${p.summary}</div>` : ''}
                        </div>
                    `;
                });
                listEl.innerHTML = recentHtml;

                const tagCounts = {};
                sorted.forEach(p => {
                    (p.tags || []).forEach(t => {
                        tagCounts[t] = (tagCounts[t] || 0) + 1;
                    });
                });
                const sortedTags = Object.entries(tagCounts)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10);

                if (sortedTags.length === 0) {
                    footerTags.innerHTML = '<span style="color:var(--text-secondary);font-size:14px;">暂无标签</span>';
                } else {
                    footerTags.innerHTML = sortedTags.map(([tag, count]) =>
                        `<span class="tag-btn" onclick="showPage('posts'); setTimeout(() => { document.getElementById('searchInput').value = '${tag}'; document.getElementById('searchInput').dispatchEvent(new Event('input')); }, 300);">${tag} (${count})</span>`
                    ).join('');
                }

            } catch (err) {
                listEl.innerHTML = `<p style="color:rgba(255,200,200,0.9);">⚠️ 加载失败：${err.message}</p>`;
                recentBadge.textContent = '❌';
                statPosts.textContent = '?';
                statTags.textContent = '?';
                statViews.textContent = '?';
                footerTags.innerHTML = '<span style="color:rgba(255,200,200,0.7);">加载失败</span>';
            }
        }

        // ============================================================
        //  文章页
        // ============================================================
        let allPostsData = [];
        let activeTag = null;
        let searchQuery = '';

        async function loadAllPosts() {
            const container = document.getElementById('archiveContainer');
            const filteredContainer = document.getElementById('filteredPosts');
            container.innerHTML = `<div class="loading">加载中</div>`;
            filteredContainer.style.display = 'none';

            try {
                const posts = await apiFetch('/posts');
                allPostsData = posts || [];
                renderTagCloud(allPostsData);
                renderArchive(allPostsData);
            } catch (err) {
                container.innerHTML = `<p style="color:rgba(255,200,200,0.9);">⚠️ 加载失败：${err.message}</p>`;
            }
        }

        function renderTagCloud(posts) {
            const tagMap = {};
            posts.forEach(p => {
                (p.tags || []).forEach(tag => {
                    tagMap[tag] = (tagMap[tag] || 0) + 1;
                });
            });
            const tags = Object.keys(tagMap).sort();
            const cloud = document.getElementById('tagCloud');
            if (tags.length === 0) {
                cloud.innerHTML = '<span style="color:var(--text-secondary);font-size:14px;">暂无标签</span>';
                return;
            }
            cloud.innerHTML = tags.map(tag =>
                `<button class="tag-btn ${activeTag === tag ? 'active' : ''}" data-tag="${tag}">${tag} (${tagMap[tag]})</button>`
            ).join('');

            cloud.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tag = this.dataset.tag;
                    activeTag = (activeTag === tag) ? null : tag;
                    applyFilters();
                });
            });
        }

        function renderArchive(posts) {
            const container = document.getElementById('archiveContainer');
            const sorted = [...posts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            if (sorted.length === 0) {
                container.innerHTML =
                `<div class="empty-state"><div class="icon">📭</div><p>还没有文章。</p></div>`;
                return;
            }

            const groups = {};
            sorted.forEach(p => {
                const d = new Date(p.createdAt);
                const year = d.getFullYear();
                const month = d.getMonth() + 1;
                if (!groups[year]) groups[year] = {};
                if (!groups[year][month]) groups[year][month] = [];
                groups[year][month].push(p);
            });

            let html = '';
            const years = Object.keys(groups).sort((a, b) => b - a);
            years.forEach(year => {
                html += `<div class="archive-year"><div class="year-title">📅 ${year}</div>`;
                const months = Object.keys(groups[year]).sort((a, b) => b - a);
                months.forEach(month => {
                    html += `<div class="archive-month"><div class="month-title">${year}-${String(month).padStart(2,'0')}</div>`;
                    html += `<div class="month-posts">`;
                    groups[year][month].forEach(p => {
                        html += `
                            <div class="archive-post" onclick="showPost('${p.id}')">
                                <span class="post-title">${p.title || '无标题'}</span>
                                <span class="post-date">${formatDateShort(p.createdAt)}</span>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                });
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function applyFilters() {
            let filtered = allPostsData;
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(p =>
                    (p.title || '').toLowerCase().includes(q) ||
                    (p.summary || '').toLowerCase().includes(q) ||
                    (p.content || '').toLowerCase().includes(q)
                );
            }
            if (activeTag) {
                filtered = filtered.filter(p => (p.tags || []).includes(activeTag));
            }

            const container = document.getElementById('archiveContainer');
            const filteredContainer = document.getElementById('filteredPosts');

            if (searchQuery.trim() || activeTag) {
                container.style.display = 'none';
                filteredContainer.style.display = 'block';
                if (filtered.length === 0) {
                    filteredContainer.innerHTML =
                        `<div class="empty-state"><div class="icon">🔍</div><p>没有匹配的文章。</p></div>`;
                } else {
                    let html = `<div style="margin-bottom:12px;color:var(--text-secondary);">找到 ${filtered.length} 篇文章</div>`;
                    filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(p => {
                        const tags = (p.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
                        html += `
                            <div class="post-card" onclick="showPost('${p.id}')" style="margin-bottom:12px;">
                                <div class="post-title">${p.title || '无标题'}</div>
                                <div class="post-meta">
                                    <span>📅 ${formatDate(p.createdAt)}</span>
                                    ${tags ? `<span>🏷️ ${tags}</span>` : ''}
                                </div>
                                ${p.summary ? `<div class="post-summary">${p.summary}</div>` : ''}
                            </div>
                        `;
                    });
                    filteredContainer.innerHTML = html;
                }
            } else {
                container.style.display = 'block';
                filteredContainer.style.display = 'none';
            }

            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tag === activeTag);
            });
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            searchQuery = this.value;
            applyFilters();
        });
        document.getElementById('clearSearchBtn').addEventListener('click', function() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            activeTag = null;
            applyFilters();
        });

        // ============================================================
        //  🆕 文件云盘功能
        // ============================================================
        async function loadFiles() {
            const listEl = document.getElementById('fileList');
            const countEl = document.getElementById('fileCount');
            listEl.innerHTML = `<div class="loading">加载文件列表...</div>`;

            try {
                const response = await fetch('/api/files');
                if (!response.ok) throw new Error('加载失败');
                const files = await response.json();

                countEl.textContent = `共 ${files.length} 个文件`;

                if (files.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📂</div>
                            <p>还没有文件，上传一个吧！</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                files.forEach(file => {
                    const icon = getFileIcon(file.name);
                    const date = new Date(file.uploadedAt);
                    const dateStr = date.toLocaleString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric',
                        hour: '2-digit', minute: '2-digit' });
                    html += `
                        <div class="file-item">
                            <div class="file-info">
                                <span class="file-icon">${icon}</span>
                                <div>
                                    <div class="file-name">${escapeHtml(file.name)}</div>
                                    <div class="file-meta">
                                        <span>📦 ${file.sizeFormatted}</span>
                                        <span>📅 ${dateStr}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="file-actions">
                                <a href="/api/files/${encodeURIComponent(file.name)}" class="btn btn-download" download>⬇️ 下载</a>
                                <button class="btn btn-delete" onclick="deleteFile('${encodeURIComponent(file.name)}')">🗑️ 删除</button>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

            } catch (err) {
                listEl.innerHTML = `<p style="color:rgba(255,200,200,0.9);">⚠️ 加载失败：${err.message}</p>`;
            }
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                pdf: '📄',
                doc: '📝',
                docx: '📝',
                xls: '📊',
                xlsx: '📊',
                ppt: '📽️',
                pptx: '📽️',
                zip: '📦',
                rar: '📦',
                '7z': '📦',
                tar: '📦',
                gz: '📦',
                mp3: '🎵',
                wav: '🎵',
                flac: '🎵',
                mp4: '🎬',
                avi: '🎬',
                mov: '🎬',
                mkv: '🎬',
                jpg: '🖼️',
                jpeg: '🖼️',
                png: '🖼️',
                gif: '🖼️',
                webp: '🖼️',
                svg: '🖼️',
                txt: '📃',
                md: '📃',
                json: '📃',
                xml: '📃',
                html: '🌐',
                css: '🎨',
                js: '⚡',
                py: '🐍',
                java: '☕',
                c: '🔧',
                cpp: '🔧',
                h: '🔧',
                go: '🐹',
                rs: '🦀',
                exe: '⚙️',
                dmg: '💿',
                iso: '💿',
            };
            return icons[ext] || '📎';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ----- 文件上传 -----
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');

        uploadArea.addEventListener('click', function() {
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                uploadFiles();
            }
        });

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                uploadFiles();
            }
        });

        async function uploadFiles() {
            const files = fileInput.files;
            if (files.length === 0) return;

            if (!authToken) {
                alert('请先登录管理后台再进行文件操作');
                return;
            }

            uploadProgress.style.display = 'flex';
            const total = files.length;
            let uploaded = 0;

            for (let i = 0; i < total; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('files', file);

                try {
                    const response = await fetch('/api/files/upload', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + authToken,
                        },
                        body: formData,
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.message || '上传失败');
                    uploaded++;
                    const percent = Math.round((uploaded / total) * 100);
                    progressFill.style.width = percent + '%';
                    progressText.textContent = `上传中 ${percent}% (${uploaded}/${total})`;
                } catch (error) {
                    progressText.textContent = `❌ 第 ${i+1} 个文件上传失败：${error.message}`;
                    setTimeout(() => {
                        uploadProgress.style.display = 'none';
                        progressFill.style.width = '0%';
                    }, 3000);
                    return;
                }
            }

            progressText.textContent = `✅ 成功上传 ${uploaded} 个文件！`;
            setTimeout(() => {
                uploadProgress.style.display = 'none';
                progressFill.style.width = '0%';
                fileInput.value = '';
                loadFiles();
            }, 1500);
        }

        // ----- 文件删除 -----
        window.deleteFile = async function(filename) {
            if (!authToken) {
                alert('请先登录管理后台');
                return;
            }
            if (!confirm(`确定要删除文件 "${filename}" 吗？`)) return;

            try {
                const response = await fetch(`/api/files/${filename}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                    },
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || '删除失败');
                }
                alert('✅ 文件已删除');
                loadFiles();
            } catch (error) {
                alert('❌ 删除失败：' + error.message);
            }
        };

        document.getElementById('refreshFilesBtn').addEventListener('click', function() {
            loadFiles();
        });

        // ============================================================
        //  文章详情（含阅读数 + 代码高亮）
        // ============================================================
        async function showPost(id) {
            const detailEl = document.getElementById('post-detail-content');
            detailEl.innerHTML = `<div class="loading">加载文章</div>`;
            Object.values(pages).forEach(el => el.classList.add('hidden'));
            pages.post.classList.remove('hidden');
            navLinks.forEach(link => link.classList.remove('active'));

            try {
                const post = await apiFetch(`/posts/${id}`);
                if (!post) {
                    detailEl.innerHTML =
                        `<p>⚠️ 文章不存在或已被删除。</p><button class="btn" onclick="showPage('home')">← 返回首页</button>`;
                    return;
                }

                fetch(`${API_BASE}/posts/${id}/views`, { method: 'POST' }).catch(() => {});
                let views = 0;
                try {
                    const viewRes = await fetch(`${API_BASE}/posts/${id}/views`);
                    const viewData = await viewRes.json();
                    views = viewData.views || 0;
                } catch (_) {}

                const tags = (post.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
                const contentHtml = renderMarkdown(post.content || '');
                detailEl.innerHTML = `
                    <h1 class="post-title">${post.title || '无标题'}</h1>
                    <div class="post-meta">
                        <span>📅 ${formatDate(post.createdAt)}</span>
                        ${post.updatedAt && post.updatedAt !== post.createdAt ? `<span>✏️ 更新于 ${formatDate(post.updatedAt)}</span>` : ''}
                        ${tags ? `<span>🏷️ ${tags}</span>` : ''}
                        <span>👁️ ${views} 次阅读</span>
                    </div>
                    <div class="post-content">${contentHtml}</div>
                    <div class="post-actions">
                        <button class="btn" onclick="showPage('home')">← 返回首页</button>
                        <button class="btn btn-primary" onclick="editPostFromDetail('${post.id}')">✏️ 编辑</button>
                        <button class="btn btn-success" onclick="openZoom(${JSON.stringify(post).replace(/"/g, '&quot;')})">🔍 放大阅读</button>
                    </div>
                `;

                if (typeof hljs !== 'undefined') {
                    detailEl.querySelectorAll('pre code').forEach(block => {
                        hljs.highlightElement(block);
                    });
                }

            } catch (err) {
                detailEl.innerHTML =
                    `<p style="color:rgba(255,200,200,0.9);">⚠️ 加载失败：${err.message}</p><button class="btn" onclick="showPage('home')">← 返回首页</button>`;
            }
        }

        // ============================================================
        //  放大阅读
        // ============================================================
        function openZoom(post) {
            const tags = (post.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
            zoomTitle.textContent = post.title || '无标题';
            zoomMeta.innerHTML = `
                <span>📅 ${formatDate(post.createdAt)}</span>
                ${post.updatedAt && post.updatedAt !== post.createdAt ? `<span>✏️ 更新于 ${formatDate(post.updatedAt)}</span>` : ''}
                ${tags ? `<span>🏷️ ${tags}</span>` : ''}
            `;
            zoomBody.innerHTML = renderMarkdown(post.content || '');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            if (typeof hljs !== 'undefined') {
                zoomBody.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
            }
        }

        function editPostFromDetail(id) {
            showPage('admin');
            setTimeout(() => {
                if (!authToken) { alert('请先登录管理后台'); return; }
                const items = document.querySelectorAll('#admin-list .post-item');
                let found = false;
                items.forEach(item => {
                    if (item.dataset.id === id) {
                        const btn = item.querySelector('.btn-primary');
                        if (btn) btn.click();
                        found = true;
                    }
                });
                if (!found) {
                    loadAdminList().then(() => {
                        setTimeout(() => {
                            document.querySelectorAll('#admin-list .post-item').forEach(item => {
                                if (item.dataset.id === id) {
                                    const btn = item.querySelector('.btn-primary');
                                    if (btn) btn.click();
                                }
                            });
                        }, 200);
                    });
                }
            }, 300);
        }

        const overlay = document.getElementById('zoomOverlay');
        const zoomTitle = document.getElementById('zoomTitle');
        const zoomMeta = document.getElementById('zoomMeta');
        const zoomBody = document.getElementById('zoomBody');
        const zoomClose = document.getElementById('zoomCloseBtn');

        function closeZoom() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
        overlay.addEventListener('click', function(e) { if (e.target === overlay) closeZoom(); });
        zoomClose.addEventListener('click', closeZoom);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && overlay.classList.contains('active'))
                closeZoom(); });

        // ============================================================
        //  管理后台
        // ============================================================
        let posts = [];
        let editingId = null;
        const form = document.getElementById('post-form');
        const titleInput = document.getElementById('post-title');
        const summaryInput = document.getElementById('post-summary');
        const tagsInput = document.getElementById('post-tags');
        const contentInput = document.getElementById('post-content');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const adminListEl = document.getElementById('admin-list');

        async function loadAdminList() {
            if (!authToken) return;
            try {
                posts = await apiFetch('/posts');
                renderAdminList();
            } catch (err) {
                adminListEl.innerHTML = `<p style="color:rgba(255,200,200,0.9);">⚠️ 加载列表失败：${err.message}</p>`;
            }
        }

        function renderAdminList() {
            if (!posts || posts.length === 0) {
                adminListEl.innerHTML =
                    `<div class="empty-state" style="padding:20px 0;"><div class="icon">📝</div><p>还没有文章，开始写第一篇吧！</p></div>`;
                return;
            }
            const sorted = [...posts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            let html = '';
            sorted.forEach(p => {
                html += `
                    <div class="post-item" data-id="${p.id}">
                        <div class="post-info">
                            <div style="font-weight:500;color:var(--text-color);">${p.title || '无标题'}</div>
                            <div class="text-muted text-small">📅 ${formatDate(p.createdAt)}</div>
                        </div>
                        <div class="post-actions">
                            <button class="btn btn-primary btn-sm" onclick="editPost('${p.id}')">✏️ 编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deletePost('${p.id}')">🗑️ 删除</button>
                        </div>
                    </div>
                `;
            });
            adminListEl.innerHTML = html;
        }

        function editPost(id) {
            if (!authToken) { alert('请先登录'); return; }
            const post = posts.find(p => String(p.id) === String(id));
            if (!post) { alert('文章不存在'); return; }
            editingId = post.id;
            titleInput.value = post.title || '';
            summaryInput.value = post.summary || '';
            tagsInput.value = (post.tags || []).join(' ');
            contentInput.value = post.content || '';
            formTitle.textContent = '✏️ 编辑文章';
            submitBtn.textContent = '💾 更新文章';
            cancelBtn.classList.remove('hidden');
            document.getElementById('admin-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetForm() {
            editingId = null;
            titleInput.value = '';
            summaryInput.value = '';
            tagsInput.value = '';
            contentInput.value = '';
            formTitle.textContent = '造篇新的';
            submitBtn.textContent = 'OK🆗';
            cancelBtn.classList.add('hidden');
        }

        async function savePost(e) {
            e.preventDefault();
            if (!authToken) { alert('请先登录'); return; }
            const title = titleInput.value.trim();
            const summary = summaryInput.value.trim();
            const tags = tagsInput.value.split(/\s+/).filter(Boolean);
            const content = contentInput.value;
            if (!title) { alert('请填写文章标题'); return; }
            if (!content) { alert('请填写文章内容'); return; }
            const data = { title, summary, tags, content };
            try {
                if (editingId) {
                    const updated = await apiFetch(`/posts/${editingId}`, { method: 'PUT', body: data });
                    const idx = posts.findIndex(p => String(p.id) === String(editingId));
                    if (idx !== -1) posts[idx] = updated;
                    else posts.push(updated);
                    alert('✅ 文章已更新！');
                } else {
                    const created = await apiFetch('/posts', { method: 'POST', body: data });
                    posts.push(created);
                    alert('🎉 文章发布成功！');
                }
                renderAdminList();
                resetForm();
                if (!document.getElementById('page-home').classList.contains('hidden')) loadHome();
                if (!document.getElementById('page-posts').classList.contains('hidden')) loadAllPosts();
            } catch (err) {
                alert('⚠️ 保存失败：' + err.message);
            }
        }

        async function deletePost(id) {
            if (!authToken) { alert('请先登录'); return; }
            if (!confirm('确定删除？')) return;
            try {
                await apiFetch(`/posts/${id}`, { method: 'DELETE' });
                posts = posts.filter(p => String(p.id) !== String(id));
                renderAdminList();
                if (String(editingId) === String(id)) resetForm();
                alert('🗑️ 已删除');
                if (!document.getElementById('page-home').classList.contains('hidden')) loadHome();
                if (!document.getElementById('page-posts').classList.contains('hidden')) loadAllPosts();
            } catch (err) {
                alert('⚠️ 删除失败：' + err.message);
            }
        }

        // ----- 多图上传 -----
        const imageInput = document.getElementById('imageInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadStatus = document.getElementById('uploadStatus');

        uploadBtn.addEventListener('click', async function() {
            if (!authToken) { alert('请先登录'); return; }
            const files = imageInput.files;
            if (!files || files.length === 0) {
                uploadStatus.textContent = '⚠️ 请先选择图片';
                return;
            }
            uploadBtn.disabled = true;
            const total = files.length;
            const imageUrls = [];

            for (let i = 0; i < total; i++) {
                const file = files[i];
                uploadStatus.textContent = `⏳ 上传中 (${i+1}/${total})...`;
                const formData = new FormData();
                formData.append('image', file);
                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + authToken },
                        body: formData,
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.message || '上传失败');
                    imageUrls.push(result.url);
                } catch (error) {
                    uploadStatus.textContent = `❌ 第 ${i+1} 张上传失败：${error.message}`;
                    uploadBtn.disabled = false;
                    return;
                }
            }

            if (imageUrls.length > 0) {
                const markdownImages = imageUrls.map(url => `![图片](${url})`).join('\n');
                const textarea = document.getElementById('post-content');
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const insertText = `\n${markdownImages}\n`;
                textarea.value = textarea.value.substring(0, start) + insertText + textarea.value.substring(end);
                const newPos = start + insertText.length;
                textarea.selectionStart = textarea.selectionEnd = newPos;
                textarea.focus();
                uploadStatus.textContent = `✅ 成功插入 ${imageUrls.length} 张图片！`;
                imageInput.value = '';
            } else {
                uploadStatus.textContent = '⚠️ 没有图片被插入';
            }
            uploadBtn.disabled = false;
        });

        // 暴露全局
        window.showPage = showPage;
        window.showPost = showPost;
        window.editPost = editPost;
        window.deletePost = deletePost;
        window.resetForm = resetForm;
        window.editPostFromDetail = editPostFromDetail;
        window.openZoom = openZoom;
        window.closeZoom = closeZoom;
        window.loadFiles = loadFiles;
        window.deleteFile = deleteFile;

        form.addEventListener('submit', savePost);
        cancelBtn.addEventListener('click', resetForm);

        // ----- 启动 -----
        showPage('home');
        loadHome();
        checkAdminAuth();

        console.log('✅ 博客已启动，模板化完成！');
    </script>
</body>
</html>
